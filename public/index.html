<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="format-detection" content="telephone=no" />
<title>Harcama Takip</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-2: #fafafa;
    --bg-3: #f4f4f5;
    --text: #09090b;
    --text-2: #27272a;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --black: #09090b;
    --black-hover: #1f1f23;
    --danger: #dc2626;
    --ok: #16a34a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08), 0 4px 8px rgba(0, 0, 0, 0.04);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); }
  html { overscroll-behavior-y: none; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    font-feature-settings: "tnum" 1, "cv11" 1;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
  }
  ::selection { background: #09090b; color: #ffffff; }

  /* ───── Header ───── */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
    padding: clamp(10px, 2.4vw, 14px) clamp(14px, 3.5vw, 28px);
    padding-top: max(clamp(10px, 2.4vw, 14px), env(safe-area-inset-top));
    padding-left: max(clamp(14px, 3.5vw, 28px), env(safe-area-inset-left));
    padding-right: max(clamp(14px, 3.5vw, 28px), env(safe-area-inset-right));
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  .brand {
    font-size: clamp(14px, 1.6vw, 15px); font-weight: 600; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 10px;
    min-width: 0;
  }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--black);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }
  .header-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .who {
    color: var(--text-2); font-size: 13px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 30vw;
  }
  @media (max-width: 460px) { .who { max-width: 40vw; font-size: 12px; } }

  /* Settings butonu */
  button.icon-btn {
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    width: 36px; height: 36px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; line-height: 0;
  }
  button.icon-btn svg {
    width: 16px; height: 16px; display: block;
    stroke: currentColor; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  button.icon-btn:hover { color: var(--text); background: var(--bg-2); border-color: var(--border-strong); }

  /* Lock badge (display_name set ise) */
  .lock-badge {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 6px; font-size: 11px; color: var(--muted);
    font-weight: 500;
  }
  .input-readonly {
    background: var(--bg-3); color: var(--text-2);
    cursor: not-allowed; opacity: 0.85;
  }
  .input-readonly:hover, .input-readonly:focus {
    border-color: var(--border); box-shadow: none;
  }
  .hint-text {
    margin: 6px 0 0; font-size: 12px; color: var(--muted);
  }
  .hint-text.warn { color: #b45309; }

  /* Geniş modal (kişi detay, admin paneli) */
  .modal.modal-wide { max-width: 640px; }

  /* Tıklanabilir stat-row (kendi adı) */
  .stat-row.clickable {
    cursor: pointer;
    margin: 0 -10px;
    padding-left: 10px;
    padding-right: 10px;
    border-radius: 6px;
    transition: background 0.12s;
  }
  .stat-row.clickable:hover { background: var(--bg-3); }
  .stat-row.clickable:active { background: var(--bg-2); }
  .stat-row.self .stat-name::after {
    content: "(sen)"; margin-left: 6px;
    font-size: 11px; font-weight: 500; color: var(--muted-2);
    text-transform: lowercase;
  }
  .stat-row.locked { opacity: 0.92; }

  /* Kişi detay modal içeriği */
  .pd-filter { margin-bottom: 12px; }
  .pd-list {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 48vh; overflow-y: auto;
    margin: 4px 0 12px;
    padding-right: 2px;
  }
  .pd-item {
    display: grid;
    grid-template-columns: 1fr auto 38px;
    gap: 4px 12px;
    align-items: center;
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .pd-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; grid-column: 1; }
  .pd-desc { font-size: 14px; font-weight: 500; color: var(--text); }
  .pd-desc.empty { color: var(--muted-2); font-weight: 400; }
  .pd-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pd-meta .pill { padding: 1px 7px; font-size: 11px; }
  .pd-note { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 2px; }
  .pd-amount { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; grid-column: 2; }
  .pd-del { grid-column: 3; }
  .pd-empty {
    padding: 28px 12px; text-align: center; color: var(--muted);
    font-size: 13px;
  }
  .pd-total {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 14px; border-radius: 8px;
    background: var(--bg-2); border: 1px solid var(--border);
    font-size: 13px;
  }
  .pd-total .label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; font-size: 11px; }
  .pd-total .amount { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }

  /* Admin panel */
  .admin-user-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 60vh; overflow-y: auto;
  }
  .admin-user {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    align-items: center;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 9px;
  }
  .admin-user .au-name {
    font-size: 14px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .admin-user .au-name .admin-tag {
    font-size: 10px; font-weight: 600; color: #fff;
    background: var(--black); padding: 1px 6px; border-radius: 99px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .admin-user .au-name .you-tag {
    font-size: 10px; font-weight: 500; color: var(--muted);
  }
  .admin-user .au-email { font-size: 12px; color: var(--muted); grid-column: 1; }
  .admin-user .au-stats {
    font-size: 12px; color: var(--muted); grid-column: 1;
    font-variant-numeric: tabular-nums;
  }
  .admin-user .au-toggle { grid-column: 2; grid-row: 1 / span 3; align-self: center; }

  /* Toggle switch */
  .switch {
    position: relative;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track {
    width: 38px; height: 22px; border-radius: 99px;
    background: var(--bg-3); border: 1px solid var(--border);
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }
  .switch .track::after {
    content: ""; position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 99px;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: transform 0.15s;
  }
  .switch input:checked + .track {
    background: var(--black); border-color: var(--black);
  }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch input:disabled + .track { opacity: 0.5; cursor: not-allowed; }
  .switch .label { font-size: 12px; color: var(--text-2); }

  @media (max-width: 480px) {
    .pd-item {
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
    }
    .pd-main { grid-column: 1 / -1; }
    .pd-amount { grid-column: 1; }
    .pd-del { grid-column: 2; grid-row: 2; width: 36px; }
    .admin-user { grid-template-columns: 1fr auto; }
  }

  main {
    max-width: 1080px; margin: 0 auto;
    padding: clamp(20px, 4vw, 32px) clamp(14px, 3.5vw, 24px) clamp(48px, 8vw, 80px);
  }

  /* ───── Card ───── */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .card-head {
    padding: clamp(14px, 3vw, 18px) clamp(16px, 4vw, 22px);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; flex-wrap: wrap;
  }
  .card-head h2 {
    margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em;
  }
  .card-head .hint { font-size: 12px; color: var(--muted); }
  .card-body { padding: clamp(14px, 3vw, 20px) clamp(16px, 4vw, 22px); }

  /* ───── Inputs ───── */
  label { display: block; font-size: 12px; color: var(--text-2); font-weight: 500; margin-bottom: 6px; }
  input, button, select, textarea {
    font: inherit; color: var(--text);
    border-radius: 8px;
    outline: none;
    border: 1px solid var(--border);
  }
  input, select, textarea {
    background: var(--bg);
    padding: 9px 12px;
    transition: border-color 0.12s, box-shadow 0.12s;
    width: 100%;
  }
  input::placeholder { color: var(--muted-2); }
  input:hover { border-color: var(--border-strong); }
  input:focus {
    border-color: var(--black);
    box-shadow: 0 0 0 3px rgba(9, 9, 11, 0.08);
  }
  input.required-empty {
    border-color: #fca5a5;
    background: #fef2f2;
  }
  input[type="date"] {
    color-scheme: light;
  }

  /* ───── Buttons ───── */
  button {
    cursor: pointer; font-weight: 500; font-size: 14px;
    padding: 9px 16px;
    background: var(--black); color: #fff;
    border: 1px solid var(--black);
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
  }
  button:hover { background: var(--black-hover); border-color: var(--black-hover); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  button.ghost {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
  }
  button.ghost:hover { background: var(--bg-2); border-color: var(--border-strong); }

  button.icon {
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    width: 34px; height: 34px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; line-height: 0;
  }
  button.icon svg {
    width: 15px; height: 15px; display: block;
    stroke: currentColor; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  button.icon:hover {
    color: var(--danger); background: #fef2f2; border-color: #fecaca;
  }

  /* ───── Entry rows ───── */
  #rows { display: flex; flex-direction: column; gap: 8px; }
  .entry {
    display: grid;
    grid-template-columns: 140px 1fr 140px 140px 38px;
    gap: 8px;
    align-items: stretch;
    padding: 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    animation: fadeIn 0.18s ease;
  }
  .entry input { background: var(--bg); }
  .entry .f-rm {
    width: 38px; height: auto;
    align-self: stretch;
  }
  .entry .note-input {
    grid-column: 1 / -1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-size: 13px;
  }
  .entry .f-amount { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 760px) {
    .entry {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "date   amount"
        "desc   desc"
        "pm     pm"
        "note   note"
        ".      rm";
      gap: 8px; padding: 12px;
    }
    .entry .f-date    { grid-area: date; }
    .entry .f-amount  { grid-area: amount; }
    .entry .f-desc    { grid-area: desc; }
    .entry .f-pm      { grid-area: pm; }
    .entry .note-input{ grid-area: note; }
    .entry .f-rm      { grid-area: rm; justify-self: end; }
    /* iOS zoom önle: input font-size >= 16px */
    .entry input { font-size: 16px; padding: 11px 12px; }
    .entry .f-amount { font-size: 16px; }
    button.icon { width: 38px; height: 38px; }
  }

  .actions {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: clamp(12px, 3vw, 16px) clamp(16px, 4vw, 22px);
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    border-radius: 0 0 10px 10px;
  }
  .save-msg { font-size: 12px; color: var(--muted); margin-left: auto; }
  @media (max-width: 480px) {
    .save-msg { display: none; }
    .actions #save, .actions #add-row { flex: 1; }
  }

  /* ───── Summary ───── */
  .summary-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }
  .summary-grid > div { padding: 0; }
  .summary-grid > div + div {
    border-left: 1px solid var(--border);
  }
  @media (max-width: 760px) {
    .summary-grid { grid-template-columns: 1fr; }
    .summary-grid > div + div { border-left: none; border-top: 1px solid var(--border); }
  }
  .sub-h {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: clamp(14px, 3vw, 16px) clamp(16px, 4vw, 22px) 10px; margin: 0;
  }
  .stats { padding: 0 clamp(16px, 4vw, 22px) clamp(14px, 3vw, 18px); }
  .stat-row {
    display: flex; flex-direction: column; gap: 5px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px;
  }
  .stat-name { font-weight: 500; color: var(--text); }
  .stat-amount { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .stat-meta { font-size: 11px; color: var(--muted); }
  .bar { height: 3px; background: var(--bg-3); border-radius: 99px; overflow: hidden; }
  .bar > .fill {
    height: 100%; background: var(--black); border-radius: 99px;
    transition: width 0.4s ease;
  }

  .total-bar {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: clamp(14px, 3vw, 16px) clamp(16px, 4vw, 22px);
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    border-radius: 0 0 10px 10px;
    gap: 12px; flex-wrap: wrap;
  }
  .total-bar .label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .total-bar .amount {
    font-size: clamp(20px, 4vw, 22px); font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text); letter-spacing: -0.02em;
  }
  @media (max-width: 380px) {
    .total-bar { flex-direction: column; align-items: flex-start; gap: 4px; }
  }

  /* ───── Table ───── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 580px; }
  th, td { padding: 11px clamp(14px, 3vw, 22px); text-align: left; font-size: 14px; }
  th {
    color: var(--muted); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
    background: var(--bg-2);
  }
  td { border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-2); }
  td.amount {
    text-align: right; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 99px;
    background: var(--bg-3); color: var(--text-2);
    font-size: 12px; font-weight: 500;
  }
  .dim { color: var(--muted-2); }
  .note-cell { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Mobilde tablo → kart */
  @media (max-width: 640px) {
    .table-wrap { overflow: visible; padding: 12px clamp(14px, 4vw, 18px) 14px; }
    table { min-width: 0; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tr {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--bg);
    }
    tr:hover td { background: transparent; }
    td {
      border: none; padding: 4px 0;
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; text-align: right; font-size: 14px; flex-wrap: wrap;
    }
    td::before {
      content: attr(data-label);
      color: var(--muted); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      flex-shrink: 0; align-self: center;
    }
    td.amount {
      padding-top: 10px; margin-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 16px;
    }
    td .note-cell {
      flex-basis: 100%; text-align: left; margin-top: 4px;
    }
  }

  .empty {
    color: var(--muted); padding: 40px 20px; font-size: 14px; text-align: center;
  }

  /* ───── Auth ───── */
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: clamp(16px, 4vw, 24px); background: var(--bg-2);
  }
  .auth-card {
    width: 100%; max-width: 380px;
  }
  @media (max-width: 480px) {
    .auth-card .field input,
    .auth-card .auth-actions button { font-size: 16px; }
  }
  .auth-hero {
    text-align: center; margin-bottom: 28px;
  }
  .auth-hero .brand-mark {
    width: 36px; height: 36px; border-radius: 9px; font-size: 16px;
    margin: 0 auto 14px; display: inline-flex;
  }
  .auth-hero h1 {
    margin: 0 0 6px; font-size: 22px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--text);
  }
  .auth-hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .tabs {
    display: flex; gap: 0; margin-bottom: 18px;
    background: var(--bg-3); padding: 3px; border-radius: 9px;
  }
  .tab {
    flex: 1; padding: 7px; text-align: center; cursor: pointer;
    border-radius: 6px; color: var(--muted); font-size: 13px; font-weight: 500;
    user-select: none; transition: all 0.12s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--bg); color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .field { margin-bottom: 12px; }
  .auth-msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
  .auth-msg.error { color: var(--danger); }
  .auth-msg.ok { color: var(--ok); }
  .auth-actions button { width: 100%; padding: 11px; font-size: 14px; }

  /* ───── Toast ───── */
  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translate(-50%, -200%);
    background: var(--text); color: #fff;
    border-radius: 10px; padding: 11px 18px;
    font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg);
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.2s, visibility 0.2s;
    z-index: 100; pointer-events: none;
    display: flex; align-items: center; gap: 8px;
    max-width: calc(100vw - 32px);
    opacity: 0;
    visibility: hidden;
  }
  .toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
    visibility: visible;
  }
  .toast::before {
    content: ""; width: 6px; height: 6px; border-radius: 99px; background: #fff;
    flex-shrink: 0;
  }
  .toast.error { background: var(--danger); }
  .toast.ok::before { background: #4ade80; }
  @media (max-width: 480px) {
    .toast {
      top: 12px; left: 12px; right: 12px;
      transform: translateY(-200%); max-width: none;
      justify-content: center;
    }
    .toast.show { transform: translateY(0); }
  }

  /* ───── Loading ───── */
  .dots::after {
    display: inline-block; content: ""; width: 1em; text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: ""; } 40% { content: "."; }
    60% { content: ".."; } 80%, 100% { content: "..."; }
  }

  /* ───── Row actions (delete) ───── */
  th.col-actions, td.row-actions {
    width: 52px; padding-left: 4px; padding-right: 8px;
    text-align: center;
    vertical-align: middle;
  }
  .row-del-btn {
    background: transparent; border: 1px solid transparent;
    color: var(--muted-2);
    width: 34px; height: 34px; padding: 0;
    border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 0;
    transition: color 0.12s, background 0.12s, border-color 0.12s;
  }
  .row-del-btn svg {
    width: 16px; height: 16px; display: block;
    stroke: currentColor; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .row-del-btn:hover, .row-del-btn:focus-visible {
    color: var(--danger); background: #fef2f2; border-color: #fecaca;
  }
  .row-del-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  tr:hover .row-del-btn { color: var(--text-2); }

  /* ───── Per-person row actions ───── */
  .stat-row { position: relative; }
  .stat-actions { display: flex; gap: 4px; align-items: center; }
  .person-checkbox {
    width: 18px; height: 18px; margin: 0;
    accent-color: var(--black);
    cursor: pointer;
  }
  .stat-row.selectable { cursor: pointer; }
  .stat-row.selectable:hover { background: var(--bg-2); border-radius: 6px; margin: 0 -8px; padding-left: 8px; padding-right: 8px; }

  /* ───── Modal ───── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(9, 9, 11, 0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 16px;
    opacity: 0; transition: opacity 0.18s;
    overflow-y: auto;
  }
  .modal-backdrop.show { opacity: 1; }
  .modal {
    background: var(--bg);
    border-radius: 12px;
    width: 100%; max-width: 460px;
    max-height: calc(100vh - 32px);
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
    transform: translateY(8px) scale(0.98);
    transition: transform 0.18s;
  }
  .modal-backdrop.show .modal { transform: translateY(0) scale(1); }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h3 {
    margin: 0; font-size: 15px; font-weight: 600;
    letter-spacing: -0.005em;
  }
  .modal-head .sub {
    margin: 4px 0 0; font-size: 13px; color: var(--muted);
  }
  .modal-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
    font-size: 14px;
    color: var(--text-2);
  }
  .modal-body .field { margin-bottom: 12px; }
  .modal-body .field:last-child { margin-bottom: 0; }
  .modal-body .checkbox-list {
    display: flex; flex-direction: column; gap: 2px;
    max-height: 240px; overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    background: var(--bg-2);
  }
  .modal-body .checkbox-list label {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    cursor: pointer; font-size: 14px; color: var(--text); font-weight: 400;
    margin-bottom: 0;
    transition: background 0.1s;
  }
  .modal-body .checkbox-list label:hover { background: var(--bg-3); }
  .modal-body .checkbox-list label input { width: auto; }
  .modal-body .checkbox-list label .meta {
    margin-left: auto; font-size: 12px; color: var(--muted);
  }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    border-radius: 0 0 12px 12px;
  }
  .modal-actions button { min-width: 90px; }
  .modal-actions .btn-danger {
    background: var(--danger); border-color: var(--danger);
  }
  .modal-actions .btn-danger:hover {
    background: #b91c1c; border-color: #b91c1c;
  }

  /* ───── Mobil tweaks ───── */
  @media (max-width: 640px) {
    td.row-actions {
      padding: 10px 0 0;
      margin-top: 8px;
      border-top: 1px dashed var(--border);
      width: auto;
      justify-content: stretch;
    }
    td.row-actions::before { display: none; }
    td.row-actions .row-del-btn {
      width: 100%; height: 40px;
      border: 1px solid var(--border);
      color: var(--danger);
      gap: 8px;
      font-size: 13px; font-weight: 500;
      line-height: 1;
    }
    td.row-actions .row-del-btn::after {
      content: "Sil";
    }
    td.row-actions .row-del-btn svg { width: 15px; height: 15px; }
  }
  @media (max-width: 480px) {
    .modal {
      max-width: none;
      align-self: flex-end;
      border-radius: 14px 14px 0 0;
      max-height: 92vh;
    }
    .modal-backdrop {
      padding: 0; align-items: flex-end;
    }
    .modal-actions {
      border-radius: 0;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    .modal-actions button { flex: 1; padding: 12px; font-size: 15px; min-height: 44px; }
    .modal-body input, .modal-body select, .modal-body textarea {
      font-size: 16px; min-height: 44px;
    }
    .modal-body .checkbox-list label { padding: 11px 10px; min-height: 44px; }
    .modal-body .checkbox-list label .person-checkbox { width: 20px; height: 20px; }
    button { min-height: 40px; }
    button.icon, .row-del-btn { min-height: 38px; }
    header { padding: 10px 12px; }
    .brand { font-size: 14px; }
    .brand-mark { width: 24px; height: 24px; }
    .actions { padding: 12px; }
    .card-head { padding: 14px 16px; }
    .card-head h2 { font-size: 15px; }
    .card-body { padding: 12px 14px; }
  }
</style>
</head>

<script>
// ───── Helpers ─────
const fmtTRY = (cents) =>
  new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY" }).format(
    Number(cents) / 100,
  );
const todayISO = () => {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
};
const fmtDate = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("tr-TR", { day: "2-digit", month: "short", year: "numeric" });
};
const escapeHtml = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
const dim = (s) => s ? escapeHtml(s) : '<span class="dim">—</span>';

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ───── Toast ─────
let toastTimer;
function toast(message, type = "ok") {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.className = "toast " + type;
  }, 2400);
}

// ───── Modal ─────
function openModal({ title, sub, bodyHTML, confirmText = "Tamam", cancelText = "Vazgeç", danger = false, dismissable = true, hideConfirm = false, extraClass = "", onConfirm, onMount }) {
  return new Promise((resolve) => {
    const root = document.getElementById("modal-root");
    const wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML = `
      <div class="modal ${extraClass}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>${escapeHtml(title)}</h3>
          ${sub ? `<p class="sub">${escapeHtml(sub)}</p>` : ""}
        </div>
        <div class="modal-body">${bodyHTML || ""}</div>
        <div class="modal-actions">
          ${dismissable ? `<button type="button" class="ghost m-cancel">${escapeHtml(cancelText)}</button>` : ""}
          ${hideConfirm ? "" : `<button type="button" class="m-confirm${danger ? " btn-danger" : ""}">${escapeHtml(confirmText)}</button>`}
        </div>
      </div>
    `;
    const cleanup = (result) => {
      wrap.classList.remove("show");
      setTimeout(() => wrap.remove(), 180);
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };

    root.appendChild(wrap);
    requestAnimationFrame(() => {
      wrap.classList.add("show");
      if (onMount) onMount(wrap, cleanup);
    });
    const onKey = (e) => {
      if (e.key === "Escape" && dismissable) cleanup(false);
      else if (e.key === "Enter" && document.activeElement?.tagName !== "TEXTAREA") {
        const btn = wrap.querySelector(".m-confirm");
        if (btn && !btn.disabled) btn.click();
      }
    };
    document.addEventListener("keydown", onKey);

    if (dismissable) {
      wrap.addEventListener("click", (e) => {
        if (e.target === wrap) cleanup(false);
      });
      const cancelBtn = wrap.querySelector(".m-cancel");
      if (cancelBtn) cancelBtn.addEventListener("click", () => cleanup(false));
    }
    const confirmBtn = wrap.querySelector(".m-confirm");
    if (confirmBtn) {
      confirmBtn.addEventListener("click", async () => {
        const btn = confirmBtn;
        const cancel = wrap.querySelector(".m-cancel");
        if (onConfirm) {
          btn.disabled = true; if (cancel) cancel.disabled = true;
          btn.classList.add("dots");
          const oldText = btn.textContent;
          btn.textContent = "İşleniyor";
          try {
            const r = await onConfirm(wrap);
            cleanup(r ?? true);
          } catch (err) {
            toast(err?.message || "Hata", "error");
            btn.disabled = false; if (cancel) cancel.disabled = false;
            btn.classList.remove("dots");
            btn.textContent = oldText;
          }
        } else {
          cleanup(true);
        }
      });
    }
  });
}

function confirmDialog({ title, sub, confirmText = "Onayla", cancelText = "Vazgeç", danger = false }) {
  return openModal({ title, sub, confirmText, cancelText, danger });
}

// ───── AUTH VIEW ─────
function renderAuth() {
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(document.getElementById("tpl-auth").content.cloneNode(true));

  let mode = "login";
  const tabs = root.querySelectorAll(".tab");
  const submit = root.querySelector("#auth-submit");
  const form = root.querySelector("#auth-form");
  const msg = root.querySelector("#auth-msg");
  const passwordInput = form.querySelector("input[name=password]");

  const setMode = (m) => {
    mode = m;
    tabs.forEach((t) => t.classList.toggle("active", t.dataset.tab === m));
    submit.textContent = m === "login" ? "Giriş yap" : "Kayıt ol";
    passwordInput.autocomplete = m === "login" ? "current-password" : "new-password";
    msg.textContent = "";
    msg.className = "auth-msg";
  };
  tabs.forEach((t) => t.addEventListener("click", () => setMode(t.dataset.tab)));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    msg.className = "auth-msg";
    const fd = new FormData(form);
    const payload = { email: fd.get("email"), password: fd.get("password") };
    submit.disabled = true;
    submit.classList.add("dots");
    submit.textContent = mode === "login" ? "Giriş yapılıyor" : "Kayıt olunuyor";
    try {
      const path = mode === "login" ? "/api/auth/login" : "/api/auth/signup";
      await api(path, { method: "POST", body: JSON.stringify(payload) });
      await boot();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "auth-msg error";
      submit.classList.remove("dots");
      submit.textContent = mode === "login" ? "Giriş yap" : "Kayıt ol";
      submit.disabled = false;
    }
  });
}

// ───── APP VIEW ─────
let currentUser = null;

function renderApp(user) {
  currentUser = user;
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(document.getElementById("tpl-app").content.cloneNode(true));

  const whoEl = document.getElementById("who");
  whoEl.textContent = user.display_name || user.email;
  whoEl.title = user.email;

  const rowsEl = document.getElementById("rows");

  function addRow(focusFirst = false) {
    const row = document.createElement("div");
    row.className = "entry";
    row.innerHTML = `
      <input type="date" class="f-date" value="${todayISO()}" />
      <input type="text" class="f-desc" placeholder="Ne için" maxlength="500" />
      <input type="text" class="f-pm" list="pm-suggestions" placeholder="Nasıl ödedi" maxlength="50" autocomplete="off" />
      <input type="number" class="f-amount" placeholder="Tutar *" min="0" step="0.01" inputmode="decimal" />
      <button type="button" class="icon f-rm" title="Sil" aria-label="Sil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
      <input type="text" class="note-input f-note" placeholder="Not / neden (opsiyonel)" maxlength="1000" />
    `;
    const amount = row.querySelector(".f-amount");
    const markEmpty = () => amount.classList.toggle("required-empty", !amount.value);
    amount.addEventListener("input", markEmpty);

    row.querySelector(".f-rm").addEventListener("click", () => {
      if (rowsEl.children.length > 1) {
        row.style.transition = "opacity 0.15s, transform 0.15s";
        row.style.opacity = "0";
        row.style.transform = "translateY(-4px)";
        setTimeout(() => row.remove(), 150);
      } else {
        row.querySelectorAll("input").forEach((i) => {
          if (i.classList.contains("f-date")) i.value = todayISO();
          else i.value = "";
        });
        markEmpty();
      }
    });
    rowsEl.appendChild(row);
    if (focusFirst) row.querySelector(".f-desc").focus();
  }
  addRow();

  document.getElementById("add-row").addEventListener("click", () => addRow(true));

  const saveBtn = document.getElementById("save");
  saveBtn.addEventListener("click", async () => {
    const items = [];
    let invalidAmount = false;
    for (const row of rowsEl.children) {
      const amountVal = row.querySelector(".f-amount").value;
      const isAllEmpty = !amountVal &&
        !row.querySelector(".f-desc").value.trim() &&
        !row.querySelector(".f-pm").value.trim() &&
        !row.querySelector(".f-note").value.trim();
      if (isAllEmpty) continue;

      if (!amountVal || Number(amountVal) <= 0) {
        invalidAmount = true;
        row.querySelector(".f-amount").classList.add("required-empty");
        continue;
      }
      items.push({
        date: row.querySelector(".f-date").value || null,
        description: row.querySelector(".f-desc").value,
        payment_method: row.querySelector(".f-pm").value,
        note: row.querySelector(".f-note").value,
        amount: Number(amountVal),
      });
    }
    if (invalidAmount) {
      toast("Tutar girilmemiş satır(lar) var", "error");
      return;
    }
    if (items.length === 0) {
      toast("Boş gönderim", "error");
      return;
    }

    saveBtn.disabled = true;
    const oldText = saveBtn.textContent;
    saveBtn.classList.add("dots");
    saveBtn.textContent = "Kaydediliyor";
    try {
      const r = await api("/api/expenses", {
        method: "POST",
        body: JSON.stringify({ items }),
      });
      toast(`${r.inserted} satır kaydedildi`, "ok");
      rowsEl.innerHTML = "";
      addRow();
      refreshData();
    } catch (err) {
      toast(err.message, "error");
    } finally {
      saveBtn.classList.remove("dots");
      saveBtn.textContent = oldText;
      saveBtn.disabled = false;
    }
  });

  document.getElementById("logout").addEventListener("click", async () => {
    await api("/api/auth/logout", { method: "POST" }).catch(() => {});
    boot();
  });

  document.getElementById("settings-btn").addEventListener("click", openSettingsModal);
  document.getElementById("merge-people-btn").addEventListener("click", openMergePeopleModal);

  applyMergeVisibility();
  handleRoute();

  refreshData();
}

function isAdminRoute() {
  return /^\/admin(\/|$)/.test(location.pathname);
}

function clearAdminRoute() {
  if (isAdminRoute()) {
    history.replaceState({}, "", "/");
  }
}

async function handleRoute() {
  if (!isAdminRoute()) return;
  if (!currentUser) return;
  if (!currentUser.is_admin) {
    // Yetkisiz erişim — URL'i temizle, sessizce ana sayfaya
    clearAdminRoute();
    return;
  }
  await openAdminPanelModal();
  clearAdminRoute();
}

function applyMergeVisibility() {
  const btn = document.getElementById("merge-people-btn");
  if (!btn || !currentUser) return;
  const allowed = currentUser.can_merge || currentUser.is_admin;
  btn.hidden = !allowed;
}

async function openSettingsModal() {
  const user = currentUser;
  if (!user) return;
  const locked = !!(user.display_name && user.display_name.trim());
  const bodyHTML = `
    <div class="field">
      <label>E-posta</label>
      <input type="text" class="input-readonly" value="${escapeHtml(user.email)}" disabled />
    </div>
    <div class="field">
      <label>Görünen ad ${locked ? '<span class="lock-badge">🔒 Kilitli</span>' : ''}</label>
      ${locked
        ? `<input type="text" class="input-readonly" value="${escapeHtml(user.display_name)}" disabled />
           <p class="hint-text">Görünen ad tek seferlik belirlenir ve değiştirilemez. Hatalı yazdıysan yöneticiyle iletişime geç.</p>`
        : `<input type="text" id="dn-input" placeholder="ör. Göktuğ Yiğit" maxlength="100" autocomplete="name" />
           <p class="hint-text warn">⚠ Bu ad tek seferlik belirlenir. Sonradan değiştirilemez.</p>`}
    </div>
  `;
  await openModal({
    title: "Ayarlar",
    bodyHTML,
    confirmText: locked ? "Kapat" : "Kaydet",
    cancelText: "Vazgeç",
    onConfirm: locked ? null : async (wrap) => {
      const input = wrap.querySelector("#dn-input");
      const name = input.value.trim().replace(/\s+/g, " ");
      if (!name) throw new Error("Ad boş olamaz");
      if (name.length < 2) throw new Error("Ad en az 2 karakter olmalı");
      const r = await api("/api/auth/me", {
        method: "POST",
        body: JSON.stringify({ display_name: name }),
      });
      currentUser = r.user;
      const whoEl = document.getElementById("who");
      if (whoEl) whoEl.textContent = currentUser.display_name;
      toast("Ad kaydedildi", "ok");
      return true;
    },
  });
}

async function promptInitialDisplayName(user) {
  document.getElementById("app").innerHTML = "";
  const bodyHTML = `
    <div class="field">
      <label>Ad Soyad</label>
      <input type="text" id="dn-input" placeholder="ör. Göktuğ Yiğit" maxlength="100" autocomplete="name" autofocus />
    </div>
    <p class="hint-text warn">⚠ Bu ad <strong>tek seferlik</strong> belirlenir, sonradan değiştirilemez. Tüm harcamalarınız bu isim altında listelenir.</p>
    <p class="hint-text">E-posta: ${escapeHtml(user.email)}</p>
  `;
  const result = await openModal({
    title: "Adınızı belirleyin",
    sub: "Devam etmek için görünen adınızı girin",
    bodyHTML,
    confirmText: "Kaydet ve devam et",
    dismissable: false,
    onConfirm: async (wrap) => {
      const input = wrap.querySelector("#dn-input");
      const name = input.value.trim().replace(/\s+/g, " ");
      if (!name) throw new Error("Ad boş olamaz");
      if (name.length < 2) throw new Error("Ad en az 2 karakter olmalı");
      const r = await api("/api/auth/me", {
        method: "POST",
        body: JSON.stringify({ display_name: name }),
      });
      return r.user;
    },
  });
  setTimeout(() => {
    const input = document.querySelector("#dn-input");
    if (input) input.focus();
  }, 50);
  return result;
}

let currentPeople = [];
let currentExpenses = [];

async function refreshData() {
  try {
    const [sum, list, people] = await Promise.all([
      api("/api/summary"),
      api("/api/expenses"),
      api("/api/people"),
    ]);
    currentPeople = Array.isArray(people?.people) ? people.people : [];
    currentExpenses = Array.isArray(list?.expenses) ? list.expenses : [];
    refreshPersonDatalist();
    renderSummary(sum);
    renderList(list);
  } catch (err) {
    console.error(err);
  }
}

function refreshPersonDatalist() {
  const dl = document.getElementById("person-suggestions");
  if (!dl) return;
  dl.innerHTML = currentPeople
    .map((p) => `<option value="${escapeHtml(p.person)}"></option>`)
    .join("");
}

function pdItemHTML(e) {
  const meta = [fmtDate(e.date)];
  return `
    <div class="pd-item" data-id="${e.id}">
      <div class="pd-main">
        <div class="pd-desc${e.description ? "" : " empty"}">${e.description ? escapeHtml(e.description) : "Açıklama yok"}</div>
        <div class="pd-meta">
          ${meta.map((m) => `<span>${escapeHtml(m)}</span>`).join(" · ")}
          ${e.payment_method ? `<span class="pill">${escapeHtml(e.payment_method)}</span>` : ""}
        </div>
        ${e.note ? `<div class="pd-note">${escapeHtml(e.note)}</div>` : ""}
      </div>
      <div class="pd-amount">${fmtTRY(e.amount_cents)}</div>
      <button type="button" class="row-del-btn pd-del" data-del-id="${e.id}" aria-label="Sil" title="Sil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
    </div>
  `;
}

async function openPersonDetailModal(personName) {
  // currentExpenses zaten sadece kendi kayıtlarımız (backend filtreliyor)
  let items = currentExpenses.filter((e) => (e.person || "") === personName);
  if (items.length === 0) {
    toast("Bu kişide kayıt yok", "error");
    return;
  }

  const uniqueDescriptions = [
    ...new Set(items.map((e) => (e.description || "").trim()).filter(Boolean)),
  ].sort();

  const bodyHTML = `
    <div class="pd-filter">
      <input type="search" id="pd-search" list="pd-desc-list" placeholder="Açıklamada ara (yakıt, yemek, işçi…)" autocomplete="off" />
      <datalist id="pd-desc-list">
        ${uniqueDescriptions.map((d) => `<option value="${escapeHtml(d)}"></option>`).join("")}
      </datalist>
    </div>
    <div class="pd-list" id="pd-list"></div>
    <div class="pd-total">
      <span class="label">Filtrelenmiş toplam</span>
      <span class="amount" id="pd-total-amount">${fmtTRY(0)}</span>
    </div>
  `;

  await openModal({
    title: personName,
    sub: `${items.length} kayıt · toplam ${fmtTRY(items.reduce((a, e) => a + Number(e.amount_cents), 0))}`,
    bodyHTML,
    confirmText: "Kapat",
    hideConfirm: true,
    cancelText: "Kapat",
    extraClass: "modal-wide",
    onMount: (wrap, close) => {
      const listEl = wrap.querySelector("#pd-list");
      const totalEl = wrap.querySelector("#pd-total-amount");
      const search = wrap.querySelector("#pd-search");

      const renderItems = () => {
        const q = (search.value || "").trim().toLowerCase();
        const filtered = q
          ? items.filter((e) =>
              (e.description || "").toLowerCase().includes(q) ||
              (e.note || "").toLowerCase().includes(q) ||
              (e.payment_method || "").toLowerCase().includes(q),
            )
          : items;
        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="pd-empty">Eşleşen kayıt yok</div>';
        } else {
          listEl.innerHTML = filtered.map(pdItemHTML).join("");
          listEl.querySelectorAll("[data-del-id]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const id = Number(btn.dataset.delId);
              const row = items.find((x) => x.id === id);
              if (!row) return;
              const summary = [
                row.description ? row.description : "(Açıklama yok)",
                fmtTRY(row.amount_cents),
                fmtDate(row.date),
              ].join(" · ");
              const ok = await confirmDialog({
                title: "Bu harcama silinsin mi?",
                sub: summary,
                confirmText: "Sil",
                danger: true,
              });
              if (!ok) return;
              btn.disabled = true;
              try {
                await api(`/api/expenses/${id}`, { method: "DELETE" });
                items = items.filter((x) => x.id !== id);
                currentExpenses = currentExpenses.filter((x) => x.id !== id);
                if (items.length === 0) {
                  toast("Silindi", "ok");
                  refreshData();
                  close();
                  return;
                }
                toast("Silindi", "ok");
                renderItems();
                refreshData();
              } catch (err) {
                btn.disabled = false;
                toast(err.message, "error");
              }
            });
          });
        }
        const total = filtered.reduce((a, e) => a + Number(e.amount_cents), 0);
        totalEl.textContent = fmtTRY(total);
      };

      search.addEventListener("input", renderItems);
      renderItems();
      setTimeout(() => search.focus(), 60);
    },
  });
}

async function openAdminPanelModal() {
  if (!currentUser?.is_admin) return;

  const bodyHTML = `
    <div class="admin-user-list" id="admin-user-list">
      <div class="pd-empty">Yükleniyor…</div>
    </div>
  `;

  await openModal({
    title: "Admin paneli",
    sub: "Kullanıcılara 'Kişileri birleştir' yetkisi açın/kapatın",
    bodyHTML,
    confirmText: "Kapat",
    hideConfirm: true,
    cancelText: "Kapat",
    extraClass: "modal-wide",
    onMount: async (wrap) => {
      const listEl = wrap.querySelector("#admin-user-list");
      let users = [];
      try {
        const r = await api("/api/admin/users");
        users = r.users || [];
      } catch (err) {
        listEl.innerHTML = `<div class="pd-empty">${escapeHtml(err.message)}</div>`;
        return;
      }
      if (users.length === 0) {
        listEl.innerHTML = '<div class="pd-empty">Kullanıcı yok</div>';
        return;
      }
      listEl.innerHTML = users
        .map((u) => {
          const name = u.display_name || "(ad belirlenmedi)";
          const isSelf = u.id === currentUser.id;
          return `
            <div class="admin-user" data-uid="${u.id}">
              <div class="au-name">
                ${escapeHtml(name)}
                ${u.is_admin ? '<span class="admin-tag">Admin</span>' : ""}
                ${isSelf ? '<span class="you-tag">(sen)</span>' : ""}
              </div>
              <div class="au-email">${escapeHtml(u.email)}</div>
              <div class="au-stats">${u.expense_count} kayıt · ${fmtTRY(u.total_cents)}</div>
              <label class="switch au-toggle" title="Kişileri birleştir yetkisi">
                <input type="checkbox" data-toggle-uid="${u.id}" ${u.can_merge ? "checked" : ""} />
                <span class="track"></span>
                <span class="label">Birleştir</span>
              </label>
            </div>`;
        })
        .join("");

      listEl.querySelectorAll("[data-toggle-uid]").forEach((input) => {
        input.addEventListener("change", async () => {
          const uid = Number(input.dataset.toggleUid);
          const desired = input.checked;
          input.disabled = true;
          try {
            await api(`/api/admin/users/${uid}`, {
              method: "PATCH",
              body: JSON.stringify({ can_merge: desired }),
            });
            toast("Yetki güncellendi", "ok");
            // Eğer admin kendi can_merge'ini değiştirdiyse currentUser'ı güncelle
            if (uid === currentUser.id) {
              currentUser = { ...currentUser, can_merge: desired };
              applyMergeVisibility();
            }
          } catch (err) {
            input.checked = !desired;
            toast(err.message, "error");
          } finally {
            input.disabled = false;
          }
        });
      });
    },
  });
}

async function openMergePeopleModal() {
  if (!currentUser?.can_merge && !currentUser?.is_admin) {
    toast("Bu işlem için yetki gerekli", "error");
    return;
  }
  const myName = (currentUser.display_name || "").trim();
  if (!myName) {
    toast("Önce adınızı belirleyin", "error");
    return;
  }

  // Sadece kendi adı OLMAYAN isimleri kaynak olarak göster (eski varyasyonlar)
  const candidates = currentPeople.filter(
    (p) => String(p.person).toLowerCase() !== myName.toLowerCase(),
  );

  if (candidates.length === 0) {
    toast("Birleştirilecek başka isim yok", "ok");
    return;
  }

  const sorted = [...candidates].sort((a, b) =>
    String(a.person).localeCompare(String(b.person), "tr"),
  );
  const bodyHTML = `
    <div class="field">
      <label>Aşağıdaki isimleri <strong>${escapeHtml(myName)}</strong> altına taşı</label>
      <div class="checkbox-list" id="merge-sources">
        ${sorted
          .map(
            (p) => `
          <label>
            <input type="checkbox" class="person-checkbox" value="${escapeHtml(p.person)}" />
            <span>${escapeHtml(p.person)}</span>
            <span class="meta">${p.count} kayıt</span>
          </label>`,
          )
          .join("")}
      </div>
    </div>
    <p class="hint-text">
      Seçilen isimlerdeki tüm kayıtlar senin adına aktarılır. Başka kullanıcıların adına atanmış kayıtlar listede görünmez.
    </p>
  `;

  await openModal({
    title: "Kişileri birleştir",
    sub: `Hedef: ${myName}`,
    bodyHTML,
    confirmText: "Birleştir",
    onConfirm: async (wrap) => {
      const sources = Array.from(
        wrap.querySelectorAll("#merge-sources input:checked"),
      ).map((c) => c.value);
      if (sources.length === 0) throw new Error("En az bir kişi seçin");

      const r = await api("/api/people/merge", {
        method: "POST",
        body: JSON.stringify({ sources, target: myName }),
      });
      toast(`${r.updated} kayıt birleştirildi`, "ok");
      refreshData();
      return true;
    },
  });
}

function renderStats(elId, items, total, opts = {}) {
  const { peopleMode = false } = opts;
  const el = document.getElementById(elId);
  if (!items.length) {
    el.innerHTML = '<div class="empty">Henüz kayıt yok</div>';
    return;
  }
  const myName = (currentUser?.display_name || "").trim().toLowerCase();
  const max = Math.max(...items.map((p) => Number(p.total_cents)));
  el.innerHTML = items
    .map((p) => {
      const name = p.person ?? p.method ?? "—";
      const pct = max > 0 ? (Number(p.total_cents) / max) * 100 : 0;
      const share = total > 0 ? Math.round((Number(p.total_cents) / total) * 100) : 0;
      const isSelf = peopleMode && myName && String(name).toLowerCase() === myName;
      const classes = ["stat-row"];
      if (isSelf) classes.push("clickable", "self");
      else if (peopleMode) classes.push("locked");
      const dataAttr = isSelf ? ` data-person="${escapeHtml(name)}"` : "";
      return `
        <div class="${classes.join(" ")}"${dataAttr}>
          <div class="stat-top">
            <span class="stat-name">${escapeHtml(name)}</span>
            <span class="stat-amount">${fmtTRY(p.total_cents)}</span>
          </div>
          <div class="stat-meta">${p.count} kayıt · %${share}</div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        </div>`;
    })
    .join("");

  if (peopleMode) {
    el.querySelectorAll(".stat-row.clickable").forEach((row) => {
      row.addEventListener("click", () => openPersonDetailModal(row.dataset.person));
    });
  }
}

function renderSummary({ per_person, per_method, total_cents }) {
  renderStats("summary-people", per_person, total_cents, { peopleMode: true });
  renderStats("summary-methods", per_method, total_cents);
  document.getElementById("grand-total").textContent = fmtTRY(total_cents);
}

function renderList({ expenses }) {
  const el = document.getElementById("list-wrap");
  if (!expenses.length) {
    el.innerHTML = '<div class="empty">Henüz kayıt yok</div>';
    return;
  }
  el.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Tarih</th>
          <th>Ne için</th>
          <th>Nasıl</th>
          <th style="text-align:right">Tutar</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody>
        ${expenses
          .map(
            (e) => `
          <tr data-id="${e.id}">
            <td data-label="Tarih">${escapeHtml(fmtDate(e.date))}</td>
            <td data-label="Ne için">
              ${dim(e.description)}
              ${e.note ? `<div class="note-cell">${escapeHtml(e.note)}</div>` : ""}
            </td>
            <td data-label="Nasıl">${e.payment_method ? `<span class="pill">${escapeHtml(e.payment_method)}</span>` : '<span class="dim">—</span>'}</td>
            <td class="amount" data-label="Tutar">${fmtTRY(e.amount_cents)}</td>
            <td class="row-actions">
              <button type="button" class="row-del-btn" data-del-id="${e.id}" aria-label="Sil" title="Sil">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
              </button>
            </td>
          </tr>`,
          )
          .join("")}
      </tbody>
    </table>
  `;

  el.querySelectorAll("[data-del-id]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = Number(btn.dataset.delId);
      const row = expenses.find((x) => x.id === id);
      if (!row) return;
      const summary = [
        row.person ? `Kim: ${row.person}` : null,
        row.description ? `Ne: ${row.description}` : null,
        `Tutar: ${fmtTRY(row.amount_cents)}`,
      ].filter(Boolean).join(" · ");
      const ok = await confirmDialog({
        title: "Bu harcama silinsin mi?",
        sub: summary,
        confirmText: "Sil",
        danger: true,
      });
      if (!ok) return;
      btn.disabled = true;
      try {
        await api(`/api/expenses/${id}`, { method: "DELETE" });
        toast("Silindi", "ok");
        refreshData();
      } catch (err) {
        btn.disabled = false;
        toast(err.message, "error");
      }
    });
  });
}

async function boot() {
  try {
    const { user } = await api("/api/auth/me");
    if (!user) {
      renderAuth();
      return;
    }
    if (!user.display_name || !user.display_name.trim()) {
      const updated = await promptInitialDisplayName(user);
      renderApp(updated);
    } else {
      renderApp(user);
    }
  } catch {
    renderAuth();
  }
}
boot();
</script>
