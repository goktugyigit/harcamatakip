<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harcama Takip</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-2: #fafafa;
    --bg-3: #f4f4f5;
    --text: #09090b;
    --text-2: #27272a;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --black: #09090b;
    --black-hover: #1f1f23;
    --danger: #dc2626;
    --ok: #16a34a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08), 0 4px 8px rgba(0, 0, 0, 0.04);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "cv11" 1;
    line-height: 1.5;
  }
  ::selection { background: #09090b; color: #ffffff; }

  /* ───── Header ───── */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
    padding: clamp(10px, 2.4vw, 14px) clamp(14px, 3.5vw, 28px);
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  .brand {
    font-size: clamp(14px, 1.6vw, 15px); font-weight: 600; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 10px;
    min-width: 0;
  }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--black);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }
  .header-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who {
    color: var(--muted); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 30vw;
  }
  @media (max-width: 460px) { .who { display: none; } }

  main {
    max-width: 1080px; margin: 0 auto;
    padding: clamp(20px, 4vw, 32px) clamp(14px, 3.5vw, 24px) clamp(48px, 8vw, 80px);
  }

  /* ───── Card ───── */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .card-head {
    padding: clamp(14px, 3vw, 18px) clamp(16px, 4vw, 22px);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; flex-wrap: wrap;
  }
  .card-head h2 {
    margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em;
  }
  .card-head .hint { font-size: 12px; color: var(--muted); }
  .card-body { padding: clamp(14px, 3vw, 20px) clamp(16px, 4vw, 22px); }

  /* ───── Inputs ───── */
  label { display: block; font-size: 12px; color: var(--text-2); font-weight: 500; margin-bottom: 6px; }
  input, button, select, textarea {
    font: inherit; color: var(--text);
    border-radius: 8px;
    outline: none;
    border: 1px solid var(--border);
  }
  input, select, textarea {
    background: var(--bg);
    padding: 9px 12px;
    transition: border-color 0.12s, box-shadow 0.12s;
    width: 100%;
  }
  input::placeholder { color: var(--muted-2); }
  input:hover { border-color: var(--border-strong); }
  input:focus {
    border-color: var(--black);
    box-shadow: 0 0 0 3px rgba(9, 9, 11, 0.08);
  }
  input.required-empty {
    border-color: #fca5a5;
    background: #fef2f2;
  }
  input[type="date"] {
    color-scheme: light;
  }

  /* ───── Buttons ───── */
  button {
    cursor: pointer; font-weight: 500; font-size: 14px;
    padding: 9px 16px;
    background: var(--black); color: #fff;
    border: 1px solid var(--black);
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
  }
  button:hover { background: var(--black-hover); border-color: var(--black-hover); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  button.ghost {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
  }
  button.ghost:hover { background: var(--bg-2); border-color: var(--border-strong); }

  button.icon {
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    width: 34px; height: 34px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 16px;
  }
  button.icon:hover {
    color: var(--danger); background: #fef2f2; border-color: #fecaca;
  }

  /* ───── Entry rows ───── */
  #rows { display: flex; flex-direction: column; gap: 8px; }
  .entry {
    display: grid;
    grid-template-columns: 130px 1.1fr 1.4fr 130px 130px 34px;
    gap: 8px;
    align-items: center;
    padding: 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    animation: fadeIn 0.18s ease;
  }
  .entry input { background: var(--bg); }
  .entry .note-input {
    grid-column: 1 / -1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-size: 13px;
  }
  .entry .f-amount { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 760px) {
    .entry {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "date   amount"
        "person person"
        "desc   desc"
        "pm     pm"
        "note   note"
        ".      rm";
      gap: 8px; padding: 12px;
    }
    .entry .f-date    { grid-area: date; }
    .entry .f-amount  { grid-area: amount; }
    .entry .f-person  { grid-area: person; }
    .entry .f-desc    { grid-area: desc; }
    .entry .f-pm      { grid-area: pm; }
    .entry .note-input{ grid-area: note; }
    .entry .f-rm      { grid-area: rm; justify-self: end; }
    /* iOS zoom önle: input font-size >= 16px */
    .entry input { font-size: 16px; padding: 11px 12px; }
    .entry .f-amount { font-size: 16px; }
    button.icon { width: 38px; height: 38px; }
  }

  .actions {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: clamp(12px, 3vw, 16px) clamp(16px, 4vw, 22px);
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    border-radius: 0 0 10px 10px;
  }
  .save-msg { font-size: 12px; color: var(--muted); margin-left: auto; }
  @media (max-width: 480px) {
    .save-msg { display: none; }
    .actions #save, .actions #add-row { flex: 1; }
  }

  /* ───── Summary ───── */
  .summary-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }
  .summary-grid > div { padding: 0; }
  .summary-grid > div + div {
    border-left: 1px solid var(--border);
  }
  @media (max-width: 760px) {
    .summary-grid { grid-template-columns: 1fr; }
    .summary-grid > div + div { border-left: none; border-top: 1px solid var(--border); }
  }
  .sub-h {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: clamp(14px, 3vw, 16px) clamp(16px, 4vw, 22px) 10px; margin: 0;
  }
  .stats { padding: 0 clamp(16px, 4vw, 22px) clamp(14px, 3vw, 18px); }
  .stat-row {
    display: flex; flex-direction: column; gap: 5px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px;
  }
  .stat-name { font-weight: 500; color: var(--text); }
  .stat-amount { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .stat-meta { font-size: 11px; color: var(--muted); }
  .bar { height: 3px; background: var(--bg-3); border-radius: 99px; overflow: hidden; }
  .bar > .fill {
    height: 100%; background: var(--black); border-radius: 99px;
    transition: width 0.4s ease;
  }

  .total-bar {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: clamp(14px, 3vw, 16px) clamp(16px, 4vw, 22px);
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    border-radius: 0 0 10px 10px;
    gap: 12px; flex-wrap: wrap;
  }
  .total-bar .label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .total-bar .amount {
    font-size: clamp(20px, 4vw, 22px); font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text); letter-spacing: -0.02em;
  }
  @media (max-width: 380px) {
    .total-bar { flex-direction: column; align-items: flex-start; gap: 4px; }
  }

  /* ───── Table ───── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 580px; }
  th, td { padding: 11px clamp(14px, 3vw, 22px); text-align: left; font-size: 14px; }
  th {
    color: var(--muted); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
    background: var(--bg-2);
  }
  td { border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-2); }
  td.amount {
    text-align: right; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 99px;
    background: var(--bg-3); color: var(--text-2);
    font-size: 12px; font-weight: 500;
  }
  .dim { color: var(--muted-2); }
  .note-cell { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Mobilde tablo → kart */
  @media (max-width: 640px) {
    .table-wrap { overflow: visible; padding: 12px clamp(14px, 4vw, 18px) 14px; }
    table { min-width: 0; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tr {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--bg);
    }
    tr:hover td { background: transparent; }
    td {
      border: none; padding: 4px 0;
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; text-align: right; font-size: 14px; flex-wrap: wrap;
    }
    td::before {
      content: attr(data-label);
      color: var(--muted); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      flex-shrink: 0; align-self: center;
    }
    td.amount {
      padding-top: 10px; margin-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 16px;
    }
    td .note-cell {
      flex-basis: 100%; text-align: left; margin-top: 4px;
    }
  }

  .empty {
    color: var(--muted); padding: 40px 20px; font-size: 14px; text-align: center;
  }

  /* ───── Auth ───── */
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: clamp(16px, 4vw, 24px); background: var(--bg-2);
  }
  .auth-card {
    width: 100%; max-width: 380px;
  }
  @media (max-width: 480px) {
    .auth-card .field input,
    .auth-card .auth-actions button { font-size: 16px; }
  }
  .auth-hero {
    text-align: center; margin-bottom: 28px;
  }
  .auth-hero .brand-mark {
    width: 36px; height: 36px; border-radius: 9px; font-size: 16px;
    margin: 0 auto 14px; display: inline-flex;
  }
  .auth-hero h1 {
    margin: 0 0 6px; font-size: 22px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--text);
  }
  .auth-hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .tabs {
    display: flex; gap: 0; margin-bottom: 18px;
    background: var(--bg-3); padding: 3px; border-radius: 9px;
  }
  .tab {
    flex: 1; padding: 7px; text-align: center; cursor: pointer;
    border-radius: 6px; color: var(--muted); font-size: 13px; font-weight: 500;
    user-select: none; transition: all 0.12s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--bg); color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .field { margin-bottom: 12px; }
  .auth-msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
  .auth-msg.error { color: var(--danger); }
  .auth-msg.ok { color: var(--ok); }
  .auth-actions button { width: 100%; padding: 11px; font-size: 14px; }

  /* ───── Toast ───── */
  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translate(-50%, -150%);
    background: var(--text); color: #fff;
    border-radius: 10px; padding: 11px 18px;
    font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg);
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100; pointer-events: none;
    display: flex; align-items: center; gap: 8px;
    max-width: calc(100vw - 32px);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast::before {
    content: ""; width: 6px; height: 6px; border-radius: 99px; background: #fff;
    flex-shrink: 0;
  }
  .toast.error { background: var(--danger); }
  .toast.ok::before { background: #4ade80; }
  @media (max-width: 480px) {
    .toast {
      top: 12px; left: 12px; right: 12px;
      transform: translateY(-150%); max-width: none;
      justify-content: center;
    }
    .toast.show { transform: translateY(0); }
  }

  /* ───── Loading ───── */
  .dots::after {
    display: inline-block; content: ""; width: 1em; text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20% { content: ""; } 40% { content: "."; }
    60% { content: ".."; } 80%, 100% { content: "..."; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<datalist id="pm-suggestions">
  <option value="Kart"></option>
  <option value="Nakit"></option>
  <option value="Kredi Kartı"></option>
  <option value="Banka Kartı"></option>
  <option value="Havale/EFT"></option>
  <option value="Diğer"></option>
</datalist>

<template id="tpl-auth">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-hero">
        <span class="brand-mark">H</span>
        <h1>Harcama Takip</h1>
        <p>Hesabına giriş yap veya yeni hesap oluştur</p>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="tabs">
            <div class="tab active" data-tab="login">Giriş</div>
            <div class="tab" data-tab="signup">Kayıt</div>
          </div>
          <form id="auth-form">
            <div class="field">
              <label>E-posta</label>
              <input type="email" name="email" autocomplete="email" placeholder="ornek@email.com" required />
            </div>
            <div class="field">
              <label>Parola</label>
              <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" />
            </div>
            <div class="auth-actions">
              <button type="submit" id="auth-submit">Giriş yap</button>
            </div>
            <div class="auth-msg" id="auth-msg"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-app">
  <header>
    <div class="brand">
      <span class="brand-mark">H</span>
      Harcama Takip
    </div>
    <div class="header-right">
      <span class="who" id="who"></span>
      <button class="ghost" id="logout">Çıkış</button>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="card-head">
        <h2>Yeni Harcama</h2>
        <span class="hint">Sadece tutar zorunlu</span>
      </div>
      <div class="card-body">
        <div id="rows"></div>
      </div>
      <div class="actions">
        <button type="button" class="ghost" id="add-row">+ Satır ekle</button>
        <span class="save-msg" id="save-msg"></span>
        <button type="button" id="save">Kaydet</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Özet</h2>
      </div>
      <div class="summary-grid">
        <div>
          <p class="sub-h">Kişi başı</p>
          <div class="stats" id="summary-people"></div>
        </div>
        <div>
          <p class="sub-h">Ödeme yöntemi</p>
          <div class="stats" id="summary-methods"></div>
        </div>
      </div>
      <div class="total-bar">
        <span class="label">Genel toplam</span>
        <span class="amount" id="grand-total">₺0,00</span>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Son Harcamalar</h2>
      </div>
      <div class="table-wrap" id="list-wrap"></div>
    </section>
  </main>
</template>

<script>
// ───── Helpers ─────
const fmtTRY = (cents) =>
  new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY" }).format(
    Number(cents) / 100,
  );
const todayISO = () => {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
};
const fmtDate = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("tr-TR", { day: "2-digit", month: "short", year: "numeric" });
};
const escapeHtml = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
const dim = (s) => s ? escapeHtml(s) : '<span class="dim">—</span>';

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ───── Toast ─────
let toastTimer;
function toast(message, type = "ok") {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.className = "toast " + type;
  }, 2400);
}

// ───── AUTH VIEW ─────
function renderAuth() {
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(document.getElementById("tpl-auth").content.cloneNode(true));

  let mode = "login";
  const tabs = root.querySelectorAll(".tab");
  const submit = root.querySelector("#auth-submit");
  const form = root.querySelector("#auth-form");
  const msg = root.querySelector("#auth-msg");
  const passwordInput = form.querySelector("input[name=password]");

  const setMode = (m) => {
    mode = m;
    tabs.forEach((t) => t.classList.toggle("active", t.dataset.tab === m));
    submit.textContent = m === "login" ? "Giriş yap" : "Kayıt ol";
    passwordInput.autocomplete = m === "login" ? "current-password" : "new-password";
    msg.textContent = "";
    msg.className = "auth-msg";
  };
  tabs.forEach((t) => t.addEventListener("click", () => setMode(t.dataset.tab)));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    msg.className = "auth-msg";
    const fd = new FormData(form);
    const payload = { email: fd.get("email"), password: fd.get("password") };
    submit.disabled = true;
    submit.classList.add("dots");
    submit.textContent = mode === "login" ? "Giriş yapılıyor" : "Kayıt olunuyor";
    try {
      const path = mode === "login" ? "/api/auth/login" : "/api/auth/signup";
      await api(path, { method: "POST", body: JSON.stringify(payload) });
      await boot();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "auth-msg error";
      submit.classList.remove("dots");
      submit.textContent = mode === "login" ? "Giriş yap" : "Kayıt ol";
      submit.disabled = false;
    }
  });
}

// ───── APP VIEW ─────
function renderApp(user) {
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(document.getElementById("tpl-app").content.cloneNode(true));
  document.getElementById("who").textContent = user.email;

  const rowsEl = document.getElementById("rows");

  function addRow(focusFirst = false) {
    const row = document.createElement("div");
    row.className = "entry";
    row.innerHTML = `
      <input type="date" class="f-date" value="${todayISO()}" />
      <input type="text" class="f-person" placeholder="Kim" maxlength="100" />
      <input type="text" class="f-desc" placeholder="Ne için" maxlength="500" />
      <input type="text" class="f-pm" list="pm-suggestions" placeholder="Nasıl ödedi" maxlength="50" />
      <input type="number" class="f-amount" placeholder="Tutar *" min="0" step="0.01" inputmode="decimal" />
      <button type="button" class="icon f-rm" title="Sil" aria-label="Sil">×</button>
      <input type="text" class="note-input f-note" placeholder="Not / neden (opsiyonel)" maxlength="1000" />
    `;
    const amount = row.querySelector(".f-amount");
    const markEmpty = () => amount.classList.toggle("required-empty", !amount.value);
    amount.addEventListener("input", markEmpty);

    row.querySelector(".f-rm").addEventListener("click", () => {
      if (rowsEl.children.length > 1) {
        row.style.transition = "opacity 0.15s, transform 0.15s";
        row.style.opacity = "0";
        row.style.transform = "translateY(-4px)";
        setTimeout(() => row.remove(), 150);
      } else {
        row.querySelectorAll("input").forEach((i) => {
          if (i.classList.contains("f-date")) i.value = todayISO();
          else i.value = "";
        });
        markEmpty();
      }
    });
    rowsEl.appendChild(row);
    if (focusFirst) row.querySelector(".f-person").focus();
  }
  addRow();

  document.getElementById("add-row").addEventListener("click", () => addRow(true));

  const saveBtn = document.getElementById("save");
  saveBtn.addEventListener("click", async () => {
    const items = [];
    let invalidAmount = false;
    for (const row of rowsEl.children) {
      const amountVal = row.querySelector(".f-amount").value;
      const isAllEmpty = !amountVal &&
        !row.querySelector(".f-person").value.trim() &&
        !row.querySelector(".f-desc").value.trim() &&
        !row.querySelector(".f-pm").value.trim() &&
        !row.querySelector(".f-note").value.trim();
      if (isAllEmpty) continue;

      if (!amountVal || Number(amountVal) <= 0) {
        invalidAmount = true;
        row.querySelector(".f-amount").classList.add("required-empty");
        continue;
      }
      items.push({
        date: row.querySelector(".f-date").value || null,
        person: row.querySelector(".f-person").value,
        description: row.querySelector(".f-desc").value,
        payment_method: row.querySelector(".f-pm").value,
        note: row.querySelector(".f-note").value,
        amount: Number(amountVal),
      });
    }
    if (invalidAmount) {
      toast("Tutar girilmemiş satır(lar) var", "error");
      return;
    }
    if (items.length === 0) {
      toast("Boş gönderim", "error");
      return;
    }

    saveBtn.disabled = true;
    const oldText = saveBtn.textContent;
    saveBtn.classList.add("dots");
    saveBtn.textContent = "Kaydediliyor";
    try {
      const r = await api("/api/expenses", {
        method: "POST",
        body: JSON.stringify({ items }),
      });
      toast(`${r.inserted} satır kaydedildi`, "ok");
      rowsEl.innerHTML = "";
      addRow();
      refreshData();
    } catch (err) {
      toast(err.message, "error");
    } finally {
      saveBtn.classList.remove("dots");
      saveBtn.textContent = oldText;
      saveBtn.disabled = false;
    }
  });

  document.getElementById("logout").addEventListener("click", async () => {
    await api("/api/auth/logout", { method: "POST" }).catch(() => {});
    boot();
  });

  refreshData();
}

async function refreshData() {
  try {
    const [sum, list] = await Promise.all([
      api("/api/summary"),
      api("/api/expenses"),
    ]);
    renderSummary(sum);
    renderList(list);
  } catch (err) {
    console.error(err);
  }
}

function renderStats(elId, items, total) {
  const el = document.getElementById(elId);
  if (!items.length) {
    el.innerHTML = '<div class="empty">Henüz kayıt yok</div>';
    return;
  }
  const max = Math.max(...items.map((p) => Number(p.total_cents)));
  el.innerHTML = items
    .map((p) => {
      const name = p.person ?? p.method ?? "—";
      const pct = max > 0 ? (Number(p.total_cents) / max) * 100 : 0;
      const share = total > 0 ? Math.round((Number(p.total_cents) / total) * 100) : 0;
      return `
        <div class="stat-row">
          <div class="stat-top">
            <span class="stat-name">${escapeHtml(name)}</span>
            <span class="stat-amount">${fmtTRY(p.total_cents)}</span>
          </div>
          <div class="stat-meta">${p.count} kayıt · %${share}</div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        </div>`;
    })
    .join("");
}

function renderSummary({ per_person, per_method, total_cents }) {
  renderStats("summary-people", per_person, total_cents);
  renderStats("summary-methods", per_method, total_cents);
  document.getElementById("grand-total").textContent = fmtTRY(total_cents);
}

function renderList({ expenses }) {
  const el = document.getElementById("list-wrap");
  if (!expenses.length) {
    el.innerHTML = '<div class="empty">Henüz kayıt yok</div>';
    return;
  }
  el.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Tarih</th>
          <th>Kim</th>
          <th>Ne için</th>
          <th>Nasıl</th>
          <th style="text-align:right">Tutar</th>
        </tr>
      </thead>
      <tbody>
        ${expenses
          .map(
            (e) => `
          <tr>
            <td data-label="Tarih">${escapeHtml(fmtDate(e.date))}</td>
            <td data-label="Kim">${dim(e.person)}</td>
            <td data-label="Ne için">
              ${dim(e.description)}
              ${e.note ? `<div class="note-cell">${escapeHtml(e.note)}</div>` : ""}
            </td>
            <td data-label="Nasıl">${e.payment_method ? `<span class="pill">${escapeHtml(e.payment_method)}</span>` : '<span class="dim">—</span>'}</td>
            <td class="amount" data-label="Tutar">${fmtTRY(e.amount_cents)}</td>
          </tr>`,
          )
          .join("")}
      </tbody>
    </table>
  `;
}

async function boot() {
  try {
    const { user } = await api("/api/auth/me");
    if (user) renderApp(user);
    else renderAuth();
  } catch {
    renderAuth();
  }
}
boot();
</script>
</body>
</html>
